# Local kind cluster for PassX.
# - Default CNI disabled so Calico can enforce NetworkPolicy.
# - Ports 80/443 mapped to the host so ingress-nginx is reachable at
#   http://*.127.0.0.1.nip.io without editing /etc/hosts.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: passx
networking:
  disableDefaultCNI: true
  podSubnet: 192.168.0.0/16
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        listenAddress: 127.0.0.1
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        listenAddress: 127.0.0.1
        protocol: TCP
