# Promtail tails every container log on the node and ships it to Loki.
# Labels stay low-cardinality: namespace, pod, container, app.
config:
  clients:
    - url: http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push
  snippets:
    pipelineStages:
      - cri: {}
    extraRelabelConfigs:
      - action: replace
        source_labels: [__meta_kubernetes_pod_label_app]
        target_label: app
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi
