# Scrape the backend's dedicated metrics port in both app namespaces.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: backend
  labels:
    app: backend
spec:
  jobLabel: app
  selector:
    matchLabels:
      app: backend
  namespaceSelector:
    matchNames:
      - passx-dev
      - passx-prod
  endpoints:
    - port: metrics
      interval: 15s
      scrapeTimeout: 10s
      path: /metrics
