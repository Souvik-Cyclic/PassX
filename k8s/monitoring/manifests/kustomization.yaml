apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  - servicemonitor-backend.yaml
  - prometheusrule-passx-slo.yaml
  - jaeger.yaml
  - networkpolicies.yaml
configMapGenerator:
  - name: grafana-dashboard-passx
    files:
      - passx-backend.json=dashboards/passx-backend.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
      annotations:
        grafana_folder: PassX
