apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: passx-dev

resources:
  - namespace.yaml
  - ../../base

images:
  - name: ghcr.io/souvik-cyclic/passx-backend
    newTag: dev

# secrets.env is gitignored; `make secrets ENV=dev` generates it.
# The hash suffix means a changed secret rolls the Deployment.
secretGenerator:
  - name: backend-secrets
    envs:
      - secrets.env

patches:
  - path: patches/ingress-host.yaml
  - path: patches/config.yaml
