apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: passx-dev

resources:
  - namespace.yaml
  - ../../base

images:
  - name: ghcr.io/souvik-cyclic/passx-backend
    newTag: dev

# Both env files are gitignored; `make secrets ENV=dev` generates them.
# backend-secrets is hash-suffixed so rotating JWT_SECRET rolls the backend.
# mongo-secrets keeps a fixed name: MONGO_INITDB_ROOT_* only apply on first
# init, so rotating them needs db.changeUserPassword (see k8s/README.md) and
# must never restart Mongo by accident.
secretGenerator:
  - name: backend-secrets
    envs:
      - secrets.env
  - name: mongo-secrets
    envs:
      - mongo.env
    options:
      disableNameSuffixHash: true

patches:
  - path: patches/ingress-host.yaml
  - path: patches/replicas.yaml

configMapGenerator:
  - name: backend-config
    behavior: merge
    literals:
      - LOG_LEVEL=debug
      # Deliberate bad release for the rollback demonstration: readiness never passes.
      - BREAK_READINESS=true
