apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: passx-prod

resources:
  - namespace.yaml
  - ../../base
  - hpa.yaml
  - pdb.yaml

images:
  - name: ghcr.io/souvik-cyclic/passx-backend
    newTag: dev

secretGenerator:
  - name: backend-secrets
    envs:
      - secrets.env

patches:
  - path: patches/ingress-host.yaml
  - path: patches/replicas.yaml
