# PassX backend CI: every push and PR is linted, tested, scanned, built and
# (on push) published to GHCR tagged by commit SHA. Deploy jobs live in cd.yml
# and run on the self-hosted runner after the build job succeeds.
# Third-party actions are pinned to commit SHAs (supply chain); Dependabot
# (.github/dependabot.yml) proposes the bumps.
name: ci

on:
  push:
    branches: [adv-devops-project, main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push to the same ref cancels the older run, so the deploy job can
# never ship an outdated commit after a newer one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE: ghcr.io/souvik-cyclic/passx-backend
  # Same mongod the e2e suite uses locally; cached between runs.
  MONGOMS_VERSION: "8.2.6"
  # On pull_request github.sha is a synthetic merge commit; tag and label the
  # image with the real head commit so /version matches git log.
  BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

defaults:
  run:
    working-directory: backend

jobs:
  quality:
    name: lint, unit, e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: backend/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: backend/.node-version
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - name: Cache mongod binary for e2e
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ env.MONGOMS_VERSION }}
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm exec eslint "src/**/*.ts" "test/**/*.ts"
      - name: Unit tests with coverage
        run: pnpm test:cov
      - name: End-to-end tests (in-memory MongoDB)
        run: pnpm test:e2e
      - name: Build
        run: pnpm build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage
          path: backend/coverage/lcov.info
          retention-days: 7

  security:
    name: secrets and dependency scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # gitleaks scans the whole history
      - name: gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: backend/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: backend/.node-version
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: pnpm audit (production deps, high and above)
        run: pnpm audit --prod --audit-level=high

  manifests:
    name: kubernetes manifests and scripts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install kustomize and kubeconform
        run: |
          curl -fsSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.8.3/kustomize_v5.8.3_linux_amd64.tar.gz" | tar xz kustomize
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz" | tar xz kubeconform
          sudo install -m 0755 kustomize kubeconform /usr/local/bin/
      # No cluster on this runner: render each overlay with placeholder secrets
      # and validate every object against the Kubernetes 1.37 schemas offline.
      - name: Render both overlays with placeholder secrets and validate schemas
        run: |
          for env in dev prod; do
            cp "k8s/overlays/$env/secrets.env.example" "k8s/overlays/$env/secrets.env"
            cp "k8s/overlays/$env/mongo.env.example" "k8s/overlays/$env/mongo.env"
            kustomize build "k8s/overlays/$env" \
              | kubeconform -strict -summary -kubernetes-version 1.37.0 -ignore-missing-schemas
            echo "overlay $env valid"
          done
      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck >/dev/null
          shellcheck scripts/*.sh backend/scripts/*.sh
      - name: actionlint
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2

  build:
    name: build, scan, push image
    needs: [quality, security, manifests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    outputs:
      image_tag: ${{ steps.meta.outputs.short_tag }}
      image_digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: meta
        name: Compute tags and build metadata
        working-directory: .
        run: |
          {
            echo "short_tag=sha-$(git rev-parse --short=7 "$BUILD_SHA")"
            echo "build_time=$(date -u +%FT%TZ)"
            echo "run_url=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } >> "$GITHUB_OUTPUT"
      - id: tags
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.IMAGE }}
          # Never "latest": every tag resolves to exactly one commit.
          flavor: latest=false
          tags: |
            type=raw,value=${{ steps.meta.outputs.short_tag }}
            type=raw,value=sha-${{ env.BUILD_SHA }}
            type=ref,event=branch
            type=semver,pattern=v{{version}}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: push
        name: Build (and push on non-PR events)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: backend
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.tags.outputs.tags }}
          labels: ${{ steps.tags.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            APP_COMMIT=${{ env.BUILD_SHA }}
            APP_IMAGE_TAG=${{ steps.meta.outputs.short_tag }}
            APP_BUILD_TIME=${{ steps.meta.outputs.build_time }}
            APP_PIPELINE_URL=${{ steps.meta.outputs.run_url }}
      - name: Trivy image scan (fail on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ steps.meta.outputs.short_tag }}
          version: v0.76.0
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
      - name: Trivy SARIF for the Security tab
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ steps.meta.outputs.short_tag }}
          version: v0.76.0
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: sarif
          output: trivy-image.sarif
      - name: Upload SARIF
        if: always() && github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@ce5e7eeac396d720fe2d802714996c8ce561e311 # v3
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image
      - name: Image smoke test (container starts, /version reports this commit)
        run: scripts/docker-smoke.sh "${IMAGE}:${{ steps.meta.outputs.short_tag }}" "${BUILD_SHA}"
      - name: Summary
        working-directory: .
        run: |
          {
            echo "### Image"
            echo "- \`${IMAGE}:${{ steps.meta.outputs.short_tag }}\`"
            echo "- digest \`${{ steps.push.outputs.digest }}\`"
            echo "- commit \`${BUILD_SHA}\`"
            echo "- run ${{ steps.meta.outputs.run_url }}"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: deploy
    needs: build
    # Only pushes (never pull_request builds) reach the self-hosted runner.
    if: github.event_name == 'push'
    uses: ./.github/workflows/cd.yml
    with:
      sha: ${{ github.sha }}
    secrets: inherit
    permissions:
      contents: read
      packages: read
